<!DOCTYPE html>
<html>
<head>
  <title>Earn ALF</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
  <h2>⛏ ALF Mining</h2>

  <p id="status">Ready to mine</p>

  <button id="mineBtn">Mine ALF</button>
</div>

<script type="module">
import { auth } from './firebase.js';

document.getElementById("mineBtn").onclick = async () => {
  try {
    const userId = auth.currentUser?.uid;

    if (!userId) {
      alert("Please login first");
      return;
    }

    // UI feedback
    document.getElementById("status").innerText = "Mining... ⛏";

    const res = await fetch("http://localhost:3000/mine", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ userId }),
    });

    const data = await res.json();

    alert(data.message);

    if (data.success) {
      document.getElementById("status").innerText =
        `Mined +${data.reward} ALF ✅`;

      document.getElementById("mineBtn").innerText =
        `+${data.reward} ALF mined`;

      console.log("New balance:", data.balance);
    } else {
      document.getElementById("status").innerText =
        data.message;
    }

  } catch (error) {
    console.error("Mining error:", error);
    alert("Something went wrong!");
    document.getElementById("status").innerText =
      "Error occurred ❌";
  }
};
</script>

</body>
</html>
