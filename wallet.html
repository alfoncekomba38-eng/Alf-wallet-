<!DOCTYPE html>
<html>
<head>
  <title>ALF Wallet</title>
</head>
<body>

<h1>My ALF Wallet</h1>

<p>Balance: <span id="balance">0</span> ALF</p>
<p>Wallet: <span id="wallet">Loading...</span></p>
<p id="status">Loading...</p>

<button onclick="mine()">Start Mining</button>

<script>
  console.log("JS IS WORKING ✔");

  let balance = localStorage.getItem("alf_balance") || 0;
  let wallet = localStorage.getItem("alf_wallet") || "ALF-" + Math.floor(Math.random()*999999);

  document.getElementById("balance").innerText = balance;
  document.getElementById("wallet").innerText = wallet;
  document.getElementById("status").innerText = "Ready to mine";

  function mine() {
    balance = Number(balance) + 1;
    localStorage.setItem("alf_balance", balance);

    document.getElementById("balance").innerText = balance;
    document.getElementById("status").innerText = "+1 ALF mined";
  }
</script>

</body>
</html>
