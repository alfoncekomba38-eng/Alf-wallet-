<!DOCTYPE html>
<html>
<head>
  <title>ALF Wallet</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    .card {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      max-width: 350px;
      margin: auto;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>My ALF Wallet</h1>

  <h3>Balance</h3>
  <p id="balance">Loading...</p>

  <h3>Wallet</h3>
  <p id="wallet">Loading...</p>

  <h3>Mining Status</h3>
  <p id="status">Loading...</p>

  <button onclick="mine()">Start Mining</button>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import {
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// LOAD USER
auth.onAuthStateChanged(async (user) => {
  if (!user) {
    document.getElementById("status").innerText = "User not logged in";
    return;
  }

  const uid = user.uid;
  const userRef = doc(db, "users", uid);
  const userSnap = await getDoc(userRef);

  // create user document first time
  if (!userSnap.exists()) {
    await setDoc(userRef, {
      balance: 0,
      lastMine: 0,
      wallet: uid
    });
  }

  loadWallet(uid);
});

// LOAD WALLET DATA
async function loadWallet(uid) {
  const userRef = doc(db, "users", uid);
  const snap = await getDoc(userRef);

  if (!snap.exists()) return;

  const data = snap.data();

  document.getElementById("balance").innerText = data.balance + " ALF";
  document.getElementById("wallet").innerText = data.wallet;
  document.getElementById("status").innerText = "Ready to mine";
}

// MINE FUNCTION
window.mine = async function () {
  const user = auth.currentUser;

  if (!user) {
    alert("Login required");
    return;
  }

  const uid = user.uid;
  const userRef = doc(db, "users", uid);
  const snap = await getDoc(userRef);

  const data = snap.data();

  const now = Date.now();
  const cooldown = 24 * 60 * 60 * 1000; // 24h

  if (now - data.lastMine < cooldown) {
    const remaining = cooldown - (now - data.lastMine);
    const hours = Math.floor(remaining / (1000 * 60 * 60));

    document.getElementById("status").innerText =
      `Wait ${hours}h before next mining`;

    return;
  }

  const newBalance = data.balance + 1;

  await updateDoc(userRef, {
    balance: newBalance,
    lastMine: now
  });

  document.getElementById("balance").innerText = newBalance + " ALF";
  document.getElementById("status").innerText = "+1 ALF mined ✔";
};
</script>

</body>
</html>
