<!DOCTYPE html>
<html>
<head>
  <title>ALF Wallet</title>
</head>
<body>

<h1>My ALF Wallet</h1>

<p>Balance: <span id="balance">Loading...</span></p>
<p>Wallet: <span id="wallet">Loading...</span></p>
<p>Mining Status: <span id="status">Loading...</span></p>

<button onclick="mine()">Start Mining</button>

<script type="module">
import { auth, db } from "./firebase.js";
import {
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    document.getElementById("status").innerText = "Not logged in";
    return;
  }

  const uid = user.uid;
  const userRef = doc(db, "users", uid);
  const userSnap = await getDoc(userRef);

  if (!userSnap.exists()) {
    await setDoc(userRef, {
      balance: 0,
      wallet: uid,
      lastMine: 0
    });
  }

  loadWallet(uid);
});

async function loadWallet(uid) {
  const userRef = doc(db, "users", uid);
  const snap = await getDoc(userRef);
  const data = snap.data();

  document.getElementById("balance").innerText = data.balance + " ALF";
  document.getElementById("wallet").innerText = data.wallet;
  document.getElementById("status").innerText = "Ready to mine";
}

window.mine = async function () {
  const user = auth.currentUser;
  if (!user) return;

  const userRef = doc(db, "users", user.uid);
  const snap = await getDoc(userRef);
  const data = snap.data();

  const now = Date.now();
  const cooldown = 24 * 60 * 60 * 1000;

  if (now - data.lastMine < cooldown) {
    document.getElementById("status").innerText = "Wait 24h";
    return;
  }

  await updateDoc(userRef, {
    balance: data.balance + 1,
    lastMine: now
  });

  loadWallet(user.uid);
}
</script>

</body>
</html>
