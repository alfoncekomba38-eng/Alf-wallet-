<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Presale</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}
.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px auto;
  border-radius: 10px;
  max-width: 420px;
}
input, button {
  padding: 10px;
  margin: 5px;
  width: 90%;
  border-radius: 6px;
  border: none;
}
button {
  background: #22c55e;
  color: white;
  cursor: pointer;
}
button:hover {
  background: #16a34a;
}
small { word-break: break-all; }
.status { font-size: 14px; opacity: 0.8; }
</style>
</head>

<body>

<h2>🚀 ALF Token Presale</h2>

<div class="card">
  <button id="walletBtn" onclick="connectWallet()">🔌 Connect Wallet</button>
  <p id="wallet">Not connected</p>
  <p class="status" id="network">Network: -</p>
</div>

<div class="card">
  <h3>Buy ALF</h3>
  <input id="amount" placeholder="Enter USDT amount" />
  <p id="preview">You will receive: 0 ALF</p>
  <button onclick="buy()">Buy Now</button>
  <p class="status" id="txStatus"></p>
</div>

<div class="card">
  <h3>🔗 Referral</h3>
  <p>Your Link:</p>
  <small id="refLink">-</small>
</div>

<div class="card">
  <h3>🎁 Rewards</h3>
  <p><span id="rewards">0</span> ALF</p>
</div>

<script>

// ========================
// CONFIG
// ========================
let account = null;
let provider, signer;

const RATE = 500;
const PRESALE = "PASTE_YOUR_PRESALE_CONTRACT";
const USDT = "0x55d398326f99059fF775485246999027B3197955"; // BSC USDT

// ========================
// ABI
// ========================
const presaleABI = [
  "function buyWithUSDT(uint256 amount) external"
];

const usdtABI = [
  "function approve(address spender, uint amount) external returns (bool)"
];

// ========================
// AUTO CONNECT
// ========================
window.addEventListener("load", async () => {
  if (window.ethereum) {
    provider = new ethers.providers.Web3Provider(window.ethereum);
    const acc = await provider.listAccounts();
    if (acc.length > 0) {
      account = acc[0];
      signer = provider.getSigner();
      afterConnect();
    }
  }
});

// ========================
// CONNECT WALLET
// ========================
async function connectWallet() {
  if (!window.ethereum) {
    alert("Install MetaMask");
    return;
  }

  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();
  account = await signer.getAddress();

  afterConnect();
}

// ========================
// AFTER CONNECT
// ========================
async function afterConnect() {

  const short = account.slice(0,6) + "..." + account.slice(-4);
  document.getElementById("wallet").innerText = short;
  document.getElementById("walletBtn").innerText = "✅ Connected";

  const net = await provider.getNetwork();
  document.getElementById("network").innerText =
    "Network: " + net.chainId;

  // suggest switch to BSC
  if (net.chainId !== 56) {
    try {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x38" }]
      });
    } catch (err) {
      alert("⚠️ Switch to BSC manually");
    }
  }

  const link = window.location.origin + "?ref=" + account;
  document.getElementById("refLink").innerText = link;

  handleReferral();
  loadRewards();
}

// ========================
// REFERRAL
// ========================
function handleReferral() {
  const ref = new URLSearchParams(window.location.search).get("ref");
  if (ref && account && ref !== account) {
    localStorage.setItem("ref_" + account, ref);
  }
}

// ========================
// LIVE PREVIEW
// ========================
document.getElementById("amount").addEventListener("input", function () {
  const val = this.value || 0;
  document.getElementById("preview").innerText =
    "You will receive: " + (val * RATE) + " ALF";
});

// ========================
// BUY (REAL)
// ========================
async function buy() {

  if (!account) return alert("Connect wallet first");

  const amount = document.getElementById("amount").value;
  if (!amount) return alert("Enter amount");

  const status = document.getElementById("txStatus");

  try {
    const value = ethers.utils.parseUnits(amount, 18);

    const usdt = new ethers.Contract(USDT, usdtABI, signer);
    const presale = new ethers.Contract(PRESALE, presaleABI, signer);

    status.innerText = "⏳ Approving USDT...";
    const tx1 = await usdt.approve(PRESALE, value);
    await tx1.wait();

    status.innerText = "🚀 Buying ALF...";
    const tx2 = await presale.buyWithUSDT(value);
    await tx2.wait();

    rewardRef(account);

    status.innerText = "✅ Success!";
    loadRewards();

  } catch (err) {
    console.error(err);
    status.innerText = "❌ Failed";
  }
}

// ========================
// REWARDS (DEMO)
// ========================
function getRewards(addr){
  return parseInt(localStorage.getItem("reward_" + addr)) || 0;
}

function rewardRef(user){
  const referrer = localStorage.getItem("ref_" + user);
  if(!referrer) return;

  let rewards = getRewards(referrer);
  rewards += 1000;

  localStorage.setItem("reward_" + referrer, rewards);
}

function loadRewards(){
  if(!account) return;
  document.getElementById("rewards").innerText = getRewards(account);
}

</script>

</body>
</html>
