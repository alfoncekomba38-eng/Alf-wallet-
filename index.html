<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Exchange + Staking</title>

<script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#fff;color:#111}

.top{
padding:15px;
background:#111;
color:#fff;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{padding:10px}

.box{
background:#f3f3f3;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

.btn{
padding:10px;
background:#ddd;
margin-top:8px;
text-align:center;
border-radius:8px;
cursor:pointer;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:6px;
border:1px solid #ccc;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ccc;
padding:6px;
text-align:center;
font-size:12px;
}
</style>
</head>

<body>

<div class="top">
<div>💎 ALF Exchange</div>
<div id="addr">Not Connected</div>
</div>

<div class="container">

<!-- WALLET -->
<div class="box">
<h3>Wallet</h3>
<div class="btn" onclick="connect()">Connect Wallet</div>
<h4>Balance: <span id="bal">0</span> ALF</h4>
</div>

<!-- STAKING -->
<div class="box">
<h3>💰 Staking</h3>
<input id="stakeAmt" placeholder="Amount to stake">
<div class="btn" onclick="stake()">Stake ALF</div>
<div class="btn" onclick="unstake()">Unstake</div>
<h4>Staked: <span id="staked">0</span> ALF</h4>
<h4>Reward: <span id="reward">0</span> ALF</h4>
</div>

<!-- SWAP -->
<div class="box">
<h3>🔁 Swap</h3>
<input id="swapAmt" placeholder="Amount ALF">
<div class="btn" onclick="swap()">Swap (Demo)</div>
</div>

<!-- ORDER -->
<div class="box">
<h3>📊 Order Book</h3>

<input id="price" placeholder="Price">
<input id="amount" placeholder="Amount">

<div class="btn" onclick="addOrder('BUY')">Buy</div>
<div class="btn" onclick="addOrder('SELL')">Sell</div>

<table>
<tr><th>Type</th><th>Price</th><th>Amount</th></tr>
<tbody id="orders"></tbody>
</table>

</div>

</div>

<script>

// ===== CONFIG =====
const TOKEN = "0xD42B0217bb40E53800384f624b62Dd7F8465d766";

let provider, signer, user, contract;

// ===== SIMPLE LOCAL STAKING =====
let staked = 0;
let reward = 0;
let lastUpdate = Date.now();

// ===== ABI =====
const abi = [
"function balanceOf(address) view returns(uint256)",
"function decimals() view returns(uint8)",
"function approve(address,uint256) returns(bool)"
];

// ================= NETWORK =================
async function switchToBNB(){
try{
await window.ethereum.request({
method:"wallet_switchEthereumChain",
params:[{ chainId:"0x38" }]
});
}catch(e){}
}

// ================= CONNECT =================
async function connect(){
try{

if(!window.ethereum){
alert("Install MetaMask");
return;
}

const acc = await window.ethereum.request({
method:"eth_requestAccounts"
});

user = acc[0];

await switchToBNB();

provider = new ethers.providers.Web3Provider(window.ethereum);
signer = provider.getSigner();

contract = new ethers.Contract(TOKEN, abi, signer);

document.getElementById("addr").innerText =
user.slice(0,6)+"..."+user.slice(-4);

await loadBalance();

alert("Connected ✔");

}catch(e){
console.log(e);
alert("Connection failed");
}
}

// ================= BALANCE =================
async function loadBalance(){
try{
let bal = await contract.balanceOf(user);
let dec = await contract.decimals();

document.getElementById("bal").innerText =
parseFloat(ethers.utils.formatUnits(bal, dec)).toLocaleString();

}catch(e){
console.log(e);
}
}

// ================= STAKING =================
function updateReward(){
let now = Date.now();
let seconds = (now - lastUpdate)/1000;

// 🔥 reward rate (edit hapa)
reward += staked * 0.000001 * seconds;

lastUpdate = now;

document.getElementById("reward").innerText =
reward.toFixed(4);
}

function stake(){

let amt = parseFloat(document.getElementById("stakeAmt").value);

if(!amt || amt <= 0){
alert("Weka amount");
return;
}

updateReward();

staked += amt;

document.getElementById("staked").innerText = staked;
alert("Staked ✔");
}

function unstake(){

updateReward();

alert("Unstaked + Reward ✔");

staked = 0;
reward = 0;

document.getElementById("staked").innerText = 0;
document.getElementById("reward").innerText = 0;
}

// ================= SWAP =================
function swap(){
alert("Next step: tutaconnect PancakeSwap 🔥");
}

// ================= ORDER =================
function addOrder(type){

let price = document.getElementById("price").value;
let amount = document.getElementById("amount").value;

if(!price || !amount){
alert("Fill fields");
return;
}

document.getElementById("orders").innerHTML += `
<tr>
<td>${type}</td>
<td>${price}</td>
<td>${amount}</td>
</tr>
`;
}

// ================= AUTO =================
setInterval(updateReward, 3000);

</script>

</body>
</html>
