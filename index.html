<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALF Wallet</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      margin: 15px 0;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
    }

    .address {
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      word-break: break-all;
    }

    .btn {
      margin: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 12px 0;
      border-top: 1px solid #334155;
    }

    .bottom-nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .reward {
      color: #facc15;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My ALF Wallet</h1>

    <div class="card">
      <p>Wallet Balance</p>
      <div class="balance" id="walletBalance">0 ALF</div>
    </div>

    <div class="card">
      <p>Wallet Address:</p>
      <div class="address" id="walletAddress">ALF-3TY0YDYQAZEJP92G</div>
      <button class="btn" onclick="copyAddress()">Copy Address</button>
      <button class="btn">Deposit</button>
      <button class="btn">Withdraw</button>
    </div>

    <div class="card">
      <h3>Mining Status</h3>
      <p class="reward">Reward: 1 ALF every 24h</p>
      <p>Next reward in: <span id="nextReward">24h 0m 0s</span></p>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html">Home</a>
    <a href="earn.html">Earn</a>
    <a href="referral.html">Referral</a>
    <a href="wallet.html">Wallet</a>
  </div>

  <script src="mining.js"></script>
  <script>
    function copyAddress() {
      const address = document.getElementById("walletAddress").innerText;
      navigator.clipboard.writeText(address);
      alert("Wallet address copied!");
    }
  </script>
</body>
</html>
