<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Wallet</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container { padding: 20px; }

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 20px;
  border-radius: 15px;
}

.balance {
  font-size: 32px;
  color: #22c55e;
}

.btn {
  margin: 6px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  cursor: pointer;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #1e293b;
  padding: 10px;
}

.bottom-nav a {
  color: white;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="container">
  <h1>My ALF Wallet</h1>

  <div class="card">
    <p>Balance</p>
    <div class="balance" id="balance">0 ALF</div>
  </div>

  <div class="card">
    <p>Wallet</p>
    <div id="wallet">Loading...</div>
    <button class="btn" onclick="copyWallet()">Copy</button>
  </div>

  <div class="card">
    <p>Mining Status</p>
    <p>Reward: 1 ALF / 24h</p>
    <p id="timer">Loading...</p>
    <button class="btn" onclick="startMining()">Start Mining</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="#">Home</a>
  <a href="#">Earn</a>
  <a href="#">Referral</a>
  <a href="#">Wallet</a>
</div>

<script type="module" src="./app.js"></script>

</body>
</html>
