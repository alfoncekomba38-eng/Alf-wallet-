<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #eef3f8;
  margin: 0;
  padding: 10px;
  padding-bottom: 80px;
}

h2 {
  color: #1e3a8a;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
  text-align: center;
}

.asset {
  background: #cfe2f3;
  padding: 12px;
  border-radius: 12px;
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

/* ===== Bottom Nav ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 65px;
  background: white;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid #ddd;
}

.nav-item {
  text-align: center;
  color: #555;
  font-size: 13px;
  cursor: pointer;
}

.nav-item.active {
  color: #2563eb;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>👛 WALLET</h2>

<div class="card">
  <button onclick="connect()">🔌 Connect Wallet</button>
  <p id="address">Not connected</p>

  <h3>Total Assets</h3>
  <h1 id="total">$0.00</h1>
</div>

<h3>Assets</h3>
<div id="assets"></div>

<!-- 🔻 BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="goTab(event,'home')">🏠<br>Home</div>
  <div class="nav-item" onclick="goTab(event,'earn')">💰<br>Earn</div>
  <div class="nav-item" onclick="goTab(event,'refer')">👥<br>Refer</div>
  <div class="nav-item" onclick="goTab(event,'wallet')">👛<br>Wallet</div>
</div>

<script>

let provider, signer, account;

// TOKENS
const TOKENS = [
  {
    name: "BNB",
    symbol: "BNB",
    address: null,
    decimals: 18,
    price: 300
  },
  {
    name: "USDT",
    symbol: "USDT",
    address: "0x55d398326f99059fF775485246999027B3197955",
    decimals: 18,
    price: 1
  },
  {
    name: "ALF",
    symbol: "ALF",
    address: "PASTE_YOUR_ALF_TOKEN",
    decimals: 18,
    price: 0.01
  }
];

// ERC20 ABI
const erc20 = [
  "function balanceOf(address) view returns (uint)"
];

// CONNECT WALLET
async function connect() {
  if (!window.ethereum) return alert("Install MetaMask");

  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();

  account = await signer.getAddress();

  document.getElementById("address").innerText =
    account.slice(0,6) + "..." + account.slice(-4);

  loadBalances();
}

// LOAD BALANCES
async function loadBalances() {

  let totalUSD = 0;
  const container = document.getElementById("assets");
  container.innerHTML = "";

  for (let t of TOKENS) {

    let balance = 0;

    try {
      if (t.address === null) {
        const b = await provider.getBalance(account);
        balance = parseFloat(ethers.utils.formatEther(b));
      } else {
        const contract = new ethers.Contract(t.address, erc20, provider);
        const b = await contract.balanceOf(account);
        balance = parseFloat(ethers.utils.formatUnits(b, t.decimals));
      }
    } catch (err) {
      console.log("Error loading", t.symbol);
    }

    const usd = balance * t.price;
    totalUSD += usd;

    container.innerHTML += `
      <div class="asset">
        <div>
          <b>${t.symbol}</b><br>
          $${t.price}
        </div>
        <div>
          ${balance.toFixed(4)}<br>
          $${usd.toFixed(2)}
        </div>
      </div>
    `;
  }

  document.getElementById("total").innerText =
    "$" + totalUSD.toFixed(2);
}

// NAVIGATION
function goTab(e, tab) {

  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.remove("active");
  });

  e.currentTarget.classList.add("active");

  if(tab === "home") alert("🏠 Home");
  if(tab === "earn") alert("💰 Earn coming soon");
  if(tab === "refer") alert("👥 Referral page");
  if(tab === "wallet") alert("👛 You are here");
}

</script>

</body>
</html>
