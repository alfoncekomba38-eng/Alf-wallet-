<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Presale</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px auto;
  border-radius: 10px;
  max-width: 420px;
}

input, button {
  padding: 10px;
  margin: 5px;
  width: 90%;
  border-radius: 6px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

small {
  word-break: break-all;
}
</style>
</head>

<body>

<h2>🚀 ALF Token Presale</h2>

<div class="card">
  <button onclick="connectWallet()">🔌 Connect Wallet</button>
  <p id="wallet">Not connected</p>
</div>

<div class="card">
  <h3>Buy ALF</h3>
  <input id="amount" placeholder="Enter USDT amount" />
  <p id="preview">You will receive: 0 ALF</p>
  <button onclick="buy()">Buy Now</button>
</div>

<div class="card">
  <h3>🔗 Referral</h3>
  <p>Your Link:</p>
  <small id="refLink">-</small>
</div>

<div class="card">
  <h3>🎁 Rewards</h3>
  <p><span id="rewards">0</span> ALF</p>
</div>

<script>

// ========================
// BASIC CONFIG
// ========================
let account;
const RATE = 500;

// Firebase mock storage (replace with Firestore later)
function getRewards(addr){
  return localStorage.getItem("reward_" + addr) || 0;
}

function saveRewards(addr, value){
  localStorage.setItem("reward_" + addr, value);
}

// ========================
// CONNECT WALLET
// ========================
async function connectWallet() {
  if (!window.ethereum) return alert("Install MetaMask");

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  const signer = provider.getSigner();

  account = await signer.getAddress();
  document.getElementById("wallet").innerText = account;

  // referral link
  const link = window.location.origin + "?ref=" + account;
  document.getElementById("refLink").innerText = link;

  loadRewards();
  handleReferral();
}

// ========================
// REFERRAL SYSTEM
// ========================
function handleReferral(){
  const urlParams = new URLSearchParams(window.location.search);
  const ref = urlParams.get("ref");

  if(ref && ref !== account){
    localStorage.setItem("ref_" + account, ref);
  }
}

// ========================
// LIVE PREVIEW
// ========================
document.getElementById("amount").addEventListener("input", function(){
  const val = this.value || 0;
  document.getElementById("preview").innerText =
    "You will receive: " + (val * RATE) + " ALF";
});

// ========================
// BUY FUNCTION (SIMULATED + READY FOR CONTRACT)
// ========================
async function buy(){

  const amount = document.getElementById("amount").value;
  if(!amount) return alert("Enter amount");

  alert("Processing purchase... 🚀");

  // 👉 HERE you will connect smart contract later
  console.log("Buying with USDT:", amount);

  // REFERRAL REWARD
  rewardRef(account);

  alert("Success! ALF received 🎉");

  loadRewards();
}

// ========================
// REFERRAL REWARD LOGIC
// ========================
function rewardRef(user){

  const referrer = localStorage.getItem("ref_" + user);
  if(!referrer) return;

  let rewards = parseInt(getRewards(referrer));
  rewards += 1000;

  saveRewards(referrer, rewards);
}

// ========================
// LOAD REWARDS
// ========================
function loadRewards(){
  if(!account) return;
  document.getElementById("rewards").innerText = getRewards(account);
}

</script>

</body>
</html>
