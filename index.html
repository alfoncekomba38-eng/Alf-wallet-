<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Wallet</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #eef3f8;
  padding: 10px;
}

h2 {
  color: #1e3a8a;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 15px;
  text-align: center;
}

.asset {
  background: #cfe2f3;
  padding: 12px;
  border-radius: 12px;
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
}
</style>
</head>

<body>

<h2>WALLET</h2>

<div class="card">
  <button onclick="connect()">🔌 Connect Wallet</button>
  <p id="address">Not connected</p>

  <h3>Total Assets</h3>
  <h1 id="total">$0.00</h1>
</div>

<h3>Assets</h3>

<div id="assets"></div>

<script>

let provider, signer, account;

const TOKENS = [
  {
    name: "BNB",
    symbol: "BNB",
    address: null,
    decimals: 18,
    price: 300 // example
  },
  {
    name: "USDT",
    symbol: "USDT",
    address: "0x55d398326f99059fF775485246999027B3197955",
    decimals: 18,
    price: 1
  },
  {
    name: "ALF",
    symbol: "ALF",
    address: "PASTE_YOUR_ALF_TOKEN",
    decimals: 18,
    price: 0.01
  }
];

// ERC20 ABI
const erc20 = [
  "function balanceOf(address) view returns (uint)"
];

// CONNECT
async function connect() {
  if (!window.ethereum) return alert("Install MetaMask");

  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();

  account = await signer.getAddress();

  document.getElementById("address").innerText =
    account.slice(0,6) + "..." + account.slice(-4);

  loadBalances();
}

// LOAD BALANCES
async function loadBalances() {

  let totalUSD = 0;
  const container = document.getElementById("assets");
  container.innerHTML = "";

  for (let t of TOKENS) {

    let balance = 0;

    if (t.address === null) {
      // native coin (BNB)
      const b = await provider.getBalance(account);
      balance = parseFloat(ethers.utils.formatEther(b));
    } else {
      const contract = new ethers.Contract(t.address, erc20, provider);
      const b = await contract.balanceOf(account);
      balance = parseFloat(ethers.utils.formatUnits(b, t.decimals));
    }

    const usd = balance * t.price;
    totalUSD += usd;

    container.innerHTML += `
      <div class="asset">
        <div>
          <b>${t.symbol}</b><br>
          $${t.price}
        </div>
        <div>
          ${balance.toFixed(4)}<br>
          $${usd.toFixed(2)}
        </div>
      </div>
    `;
  }

  document.getElementById("total").innerText =
    "$" + totalUSD.toFixed(2);
}

</script>

</body>
</html>
