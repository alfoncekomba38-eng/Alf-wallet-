<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALF Wallet</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: #1e293b;
      margin: 15px 0;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      color: #22c55e;
    }

    .address {
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      word-break: break-all;
    }

    .btn {
      margin: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: gray;
      cursor: not-allowed;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: #1e293b;
      padding: 12px 0;
      border-top: 1px solid #334155;
    }

    .bottom-nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .reward {
      color: #facc15;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My ALF Wallet</h1>

    <div class="card">
      <p>Wallet Balance</p>
      <div class="balance" id="walletBalance">0 ALF</div>
    </div>

    <div class="card">
      <p>Wallet Address:</p>
      <div class="address" id="walletAddress">ALF-3TY0YDYQAZEJP92G</div>
      <button class="btn" onclick="copyAddress()">Copy Address</button>
      <button class="btn">Deposit</button>
      <button class="btn">Withdraw</button>
    </div>

    <div class="card">
      <h3>Mining Status</h3>
      <p class="reward">Reward: 1 ALF every 24h</p>
      <p>Next reward in: <span id="nextReward">Press Start Mining</span></p>
      <button class="btn" id="startMiningBtn" onclick="startMining()">Start Mining</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html">Home</a>
    <a href="earn.html">Earn</a>
    <a href="referral.html">Referral</a>
    <a href="wallet.html">Wallet</a>
  </div>

  <script>
    let balance = parseFloat(localStorage.getItem("alfBalance")) || 0;
    let lastMiningTime = parseInt(localStorage.getItem("lastMiningTime")) || 0;
    let miningActive = localStorage.getItem("miningActive") === "true";

    const rewardPerDay = 1;
    const miningInterval = 24 * 60 * 60 * 1000;

    function copyAddress() {
      const address = document.getElementById("walletAddress").innerText;
      navigator.clipboard.writeText(address);
      alert("Wallet address copied!");
    }

    function startMining() {
      if (!miningActive) {
        miningActive = true;
        lastMiningTime = Date.now();

        localStorage.setItem("miningActive", true);
        localStorage.setItem("lastMiningTime", lastMiningTime);

        document.getElementById("startMiningBtn").innerText = "Mining Active";
        document.getElementById("startMiningBtn").disabled = true;
      }
    }

    function updateMining() {
      document.getElementById("walletBalance").innerText = balance.toFixed(2) + " ALF";

      if (miningActive) {
        const now = Date.now();
        const elapsed = now - lastMiningTime;

        if (elapsed >= miningInterval) {
          balance += rewardPerDay;
          localStorage.setItem("alfBalance", balance);

          miningActive = false;
          localStorage.setItem("miningActive", false);

          document.getElementById("startMiningBtn").innerText = "Start Mining";
          document.getElementById("startMiningBtn").disabled = false;
          document.getElementById("nextReward").innerText = "Reward Ready!";
          return;
        }

        const remaining = miningInterval - elapsed;
        const hours = Math.floor(remaining / (1000 * 60 * 60));
        const mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((remaining % (1000 * 60)) / 1000);

        document.getElementById("nextReward").innerText =
          `${hours}h ${mins}m ${secs}s`;

        document.getElementById("startMiningBtn").innerText = "Mining Active";
        document.getElementById("startMiningBtn").disabled = true;
      } else {
        document.getElementById("nextReward").innerText = "Press Start Mining";
      }
    }

    setInterval(updateMining, 1000);
    updateMining();
  </script>
</body>
</html>
