<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Presale</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px auto;
  border-radius: 10px;
  max-width: 400px;
}

input, button {
  padding: 10px;
  margin: 5px;
  width: 90%;
  border-radius: 6px;
  border: none;
}

button {
  background: #22c55e;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}
</style>
</head>

<body>

<h2>🚀 ALF Token Presale</h2>

<div class="card">
  <button onclick="connect()">🔌 Connect Wallet</button>
  <p id="wallet">Not connected</p>
</div>

<div class="card">
  <h3>Buy ALF</h3>
  <input id="amount" placeholder="Enter USDT amount" />
  <p id="preview">You will receive: 0 ALF</p>
  <button onclick="buy()">Buy Now</button>
</div>

<div class="card">
  <h3>🔗 Referral</h3>
  <p>Your Link:</p>
  <p id="refLink">-</p>

  <h3>🎁 Rewards</h3>
  <p><span id="refRewards">0</span> ALF</p>
</div>

<script>

let account;

// ⚠️ CHANGE THESE
const PRESALE = "PASTE_YOUR_PRESALE_CONTRACT";
const USDT = "0x55d398326f99059fF775485246999027B3197955";

// RATE
const RATE = 500;

// ABI
const presaleABI = [
  "function buyWithUSDT(uint amount) external"
];

const usdtABI = [
  "function approve(address spender, uint amount) external returns (bool)"
];

// GET REF FROM URL
const urlParams = new URLSearchParams(window.location.search);
const ref = urlParams.get("ref");

// CONNECT WALLET
async function connect() {
  if (!window.ethereum) return alert("Install MetaMask");

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  const signer = provider.getSigner();

  account = await signer.getAddress();

  document.getElementById("wallet").innerText = account;

  // REF LINK
  const link = window.location.origin + "?ref=" + account;
  document.getElementById("refLink").innerText = link;

  // SAVE REFERRER
  if (ref && ref !== account) {
    localStorage.setItem("ref_" + account, ref);
  }

  loadRewards();
}

// LIVE PREVIEW
document.getElementById("amount").addEventListener("input", function () {
  const val = this.value || 0;
  const alf = val * RATE;

  document.getElementById("preview").innerText =
    "You will receive: " + alf + " ALF";
});

// BUY
async function buy() {

  const amount = document.getElementById("amount").value;
  if (!amount) return alert("Enter amount");

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();

  const usdt = new ethers.Contract(USDT, usdtABI, signer);
  const presale = new ethers.Contract(PRESALE, presaleABI, signer);

  const value = ethers.utils.parseUnits(amount, 18);

  await usdt.approve(PRESALE, value);
  await presale.buyWithUSDT(value);

  rewardReferrer(account);

  alert("Success! ALF purchased 🚀");
}

// REFERRAL REWARD
function rewardReferrer(user) {

  const referrer = localStorage.getItem("ref_" + user);
  if (!referrer) return;

  let rewards = localStorage.getItem("reward_" + referrer) || 0;
  rewards = parseInt(rewards) + 1000;

  localStorage.setItem("reward_" + referrer, rewards);
}

// LOAD REWARDS
function loadRewards() {
  let rewards = localStorage.getItem("reward_" + account) || 0;
  document.getElementById("refRewards").innerText = rewards;
}

</script>

</body>
</html>
