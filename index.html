<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Exchange</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.swap-box{
  width:90%;
  max-width:400px;
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
  text-align:center;
}

button,input{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
}

input{
  background:#334155;
  color:white;
}

button{
  background:#16a34a;
  color:white;
  font-weight:bold;
}

button:hover{
  opacity:0.9;
}

.status{
  margin-top:10px;
  text-align:center;
  font-size:14px;
}

.quote{
  margin-top:15px;
  text-align:center;
  color:#38bdf8;
}
</style>
</head>
<body>

<div class="swap-box">
  <h2>ALF Exchange</h2>

  <button onclick="connectWallet()">Connect MetaMask</button>

  <input type="number" id="usdtAmount" placeholder="Enter USDT Amount">

  <button onclick="getQuote()">Get Quote</button>

  <div class="quote" id="quote">You receive: 0 ALF</div>

  <button onclick="swapUSDTtoALF()">Swap USDT → ALF</button>

  <div class="status" id="status">Wallet not connected</div>
</div>

<script>
let provider, signer, user;

const USDT = "0x55d398326f99059fF775485246999027B3197955";
const ALF = "0xEf9c435DC813d4839fdC4b4195C4B3E4F5d3D2F5";
const ROUTER = "0x10ED43C718714eb63d5aA57B78B54704E256024E";

const routerABI = [
 "function getAmountsOut(uint amountIn, address[] memory path) view returns (uint[] memory amounts)",
 "function swapExactTokensForTokensSupportingFeeOnTransferTokens(uint amountIn,uint amountOutMin,address[] calldata path,address to,uint deadline) external"
];

const erc20ABI = [
 "function approve(address spender,uint amount) external returns(bool)"
];

async function connectWallet(){
  if(!window.ethereum){
    alert("Please install MetaMask");
    return;
  }

  provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();
  user = await signer.getAddress();

  document.getElementById("status").innerText =
    "Connected: " + user.slice(0,6) + "..." + user.slice(-4);
}

async function getQuote(){
  try{
    const amount = document.getElementById("usdtAmount").value;
    const router = new ethers.Contract(ROUTER, routerABI, provider);

    const amounts = await router.getAmountsOut(
      ethers.utils.parseUnits(amount, 18),
      [USDT, ALF]
    );

    const output = ethers.utils.formatUnits(amounts[1], 18);

    document.getElementById("quote").innerText =
      "You receive: " + output + " ALF";

  }catch(err){
    console.log(err);
    alert("Quote failed");
  }
}

async function swapUSDTtoALF(){
  try{
    const amount = document.getElementById("usdtAmount").value;

    const usdt = new ethers.Contract(USDT, erc20ABI, signer);
    const router = new ethers.Contract(ROUTER, routerABI, signer);

    const amountIn = ethers.utils.parseUnits(amount, 18);

    document.getElementById("status").innerText = "Approving USDT...";
    await usdt.approve(ROUTER, amountIn);

    document.getElementById("status").innerText = "Swapping...";

    await router.swapExactTokensForTokensSupportingFeeOnTransferTokens(
      amountIn,
      0,
      [USDT, ALF],
      user,
      Math.floor(Date.now()/1000)+600
    );

    document.getElementById("status").innerText = "Swap successful!";

  }catch(err){
    console.log(err);
    document.getElementById("status").innerText = "Swap failed";
  }
}
</script>

</body>
</html>
