<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Wallet</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.container { padding: 20px; }

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 20px;
  border-radius: 15px;
}

.balance {
  font-size: 32px;
  color: #22c55e;
}

.btn {
  margin: 6px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #1e293b;
  padding: 10px;
}
.bottom-nav a { color: white; text-decoration: none; }
</style>

</head>
<body>

<div class="container">
  <h1>My ALF Wallet</h1>

  <div class="card">
    <p>Balance</p>
    <div class="balance" id="balance">0 ALF</div>
  </div>

  <div class="card">
    <p>Wallet</p>
    <div id="wallet">ALF-3TY0YDYQAZEJP92G</div>
    <button class="btn" onclick="copy()">Copy</button>
  </div>

  <div class="card">
    <p>Mining Status</p>
    <p>Reward: 1 ALF / 24h</p>
    <p id="timer">Loading...</p>
    <button class="btn" onclick="startMining()" id="btn">Start Mining</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="#">Home</a>
  <a href="#">Earn</a>
  <a href="#">Referral</a>
  <a href="#">Wallet</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyCBycKh2s1Z0CDdPaMhaYUcryc0jMuCo2U",
  authDomain: "alf-wallet.firebaseapp.com",
  projectId: "alf-wallet",
  storageBucket: "alf-wallet.firebasestorage.app",
  messagingSenderId: "451766153657",
  appId: "1:451766153657:web:6276c12f129f3b890f0668"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const wallet = "ALF-3TY0YDYQAZEJP92G";
const miningTime = 24 * 60 * 60 * 1000;

let dataRef = doc(db, "miners", wallet);

// INIT WALLET
async function init() {
  const snap = await getDoc(dataRef);
  if (!snap.exists()) {
    await setDoc(dataRef, {
      balance: 0,
      mining: false,
      last: 0
    });
  }
}
await init();

// COPY
window.copy = function () {
  navigator.clipboard.writeText(wallet);
  alert("Copied!");
};

// START MINING
window.startMining = async function () {
  await updateDoc(dataRef, {
    mining: true,
    last: Date.now()
  });
};

// UPDATE LOOP
async function loop() {
  const snap = await getDoc(dataRef);
  let d = snap.data();

  document.getElementById("balance").innerText = d.balance + " ALF";

  if (d.mining) {
    let now = Date.now();
    let diff = now - d.last;

    if (diff >= miningTime) {
      await updateDoc(dataRef, {
        balance: d.balance + 1,
        mining: false
      });
    } else {
      let r = miningTime - diff;
      let h = Math.floor(r/3600000);
      let m = Math.floor((r%3600000)/60000);
      let s = Math.floor((r%60000)/1000);
      document.getElementById("timer").innerText = `${h}h ${m}m ${s}s`;
    }
  } else {
    document.getElementById("timer").innerText = "Press Start Mining";
  }
}

setInterval(loop, 1000);
</script>

</body>
</html>
