<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALF Presale</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}
button {
  padding: 12px;
  margin: 10px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
}
input {
  padding: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h1>🚀 ALF PRESALE</h1>

<button onclick="connect()">Connect Wallet</button>
<p id="wallet"></p>

<h3>💰 Buy ALF</h3>
<input id="amount" placeholder="Enter USDT amount">
<br>
<button onclick="buy()">Buy Now</button>

<script>

let account;

// 👉 badilisha hizi
const PRESALE = "PASTE_YOUR_CONTRACT";
const USDT = "0x55d398326f99059fF775485246999027B3197955";

const presaleABI = [
  "function buyWithUSDT(uint amount) external"
];

const usdtABI = [
  "function approve(address spender, uint amount) external returns (bool)"
];

async function connect(){
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  const signer = provider.getSigner();

  account = await signer.getAddress();
  document.getElementById("wallet").innerText = account;
}

async function buy(){

  const amount = document.getElementById("amount").value;

  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();

  const usdt = new ethers.Contract(USDT, usdtABI, signer);
  const presale = new ethers.Contract(PRESALE, presaleABI, signer);

  const value = ethers.utils.parseUnits(amount, 18);

  // approve USDT
  await usdt.approve(PRESALE, value);

  // buy
  await presale.buyWithUSDT(value);

  alert("Success! ALF received 🚀");
}

</script>

</body>
</html>
