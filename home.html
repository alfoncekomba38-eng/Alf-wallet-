<!DOCTYPE html>
<html>
<head>
  <title>ALF Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>ALF Wallet</h1>
  <h2 id="balance">0 ALF</h2>
  <p id="walletAddress"></p>
</div>

<div class="nav">
  <a href="earn.html">Earn</a>
  <a href="referral.html">Referral</a>
  <a href="wallet.html">Wallet</a>
</div>

<script type="module">
import { db, auth } from './firebase.js';
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const uid = auth.currentUser.uid;
const ref = doc(db, "users", uid);

let snap = await getDoc(ref);

if (!snap.exists()) {
  await setDoc(ref, {
    balance: 0,
    miningStart: 0,
    referrals: 0,
    wallet: "ALF-" + uid.substring(0,8)
  });
  snap = await getDoc(ref);
}

const data = snap.data();

document.getElementById("balance").innerText = data.balance + " ALF";
document.getElementById("walletAddress").innerText = data.wallet;
</script>
</body>
</html>
